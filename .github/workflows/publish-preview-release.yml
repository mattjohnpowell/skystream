name: Publish Preview Release

on:
  workflow_run:
    workflows: ["Build Preview"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    if: github.repository == 'mattjohnpowell/skystream' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(./artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to publish."
            exit 0
          fi
          gh release delete sync-preview --repo "$GH_REPO" --cleanup-tag --yes || true
          gh release create sync-preview "${files[@]}" \
            --repo "$GH_REPO" \
            --title "Profile Sync Preview (Latest)" \
            --notes "Automated build from workflow run ${{ github.event.workflow_run.html_url }}." \
            --prerelease
