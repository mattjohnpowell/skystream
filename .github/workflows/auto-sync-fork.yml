name: Auto-Sync Fork & Build

on:
  schedule:
    # Runs weekly on Sundays at 04:00 UTC. Only scheduled workflows on the default branch run automatically.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Trigger Android & Windows preview build even if upstream has not changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    if: github.repository == 'mattjohnpowell/skystream'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and feature branch
        run: |
          git remote add upstream https://github.com/akashdh11/skystream.git || true
          git fetch upstream master
          git fetch origin feat/self-hosted-profile-sync

      - name: Rebase feat/self-hosted-profile-sync onto upstream/master
        id: sync
        run: |
          if git merge-base --is-ancestor upstream/master origin/feat/self-hosted-profile-sync; then
            echo "Already up to date with upstream/master."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git checkout -B feat/self-hosted-profile-sync origin/feat/self-hosted-profile-sync
            if ! git rebase upstream/master; then
              git rebase --abort
              echo "::error::Rebase conflict with upstream/master. Manual resolution required."
              exit 1
            fi
            git push --force-with-lease origin feat/self-hosted-profile-sync
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android & Windows Preview Build
        if: steps.sync.outputs.updated == 'true' || github.event.inputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run preview.yml \
            --repo "${{ github.repository }}" \
            --ref master \
            -f branch=feat/self-hosted-profile-sync \
            -f build_android=true \
            -f build_windows=true \
            -f build_ios=false \
            -f build_macos=false \
            -f build_linux=false
