name: Auto-Sync Fork & Build

on:
  schedule:
    # Runs weekly on Sundays at 04:00 UTC. Only scheduled workflows on the default branch run automatically.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Trigger Android & Windows preview build even if upstream has not changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    if: github.repository == 'mattjohnpowell/skystream'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and feature branch
        run: |
          git remote add upstream https://github.com/akashdh11/skystream.git || true
          git fetch upstream master
          git fetch origin feat/self-hosted-profile-sync

      - name: Rebase feat/self-hosted-profile-sync onto upstream/master
        id: sync
        run: |
          if git merge-base --is-ancestor upstream/master origin/feat/self-hosted-profile-sync; then
            echo "Already up to date with upstream/master."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git checkout -B feat/self-hosted-profile-sync origin/feat/self-hosted-profile-sync
            if ! git rebase upstream/master; then
              git rebase --abort
              echo "::error::Rebase conflict with upstream/master. Manual resolution required."
              exit 1
            fi
            git push --force-with-lease origin feat/self-hosted-profile-sync
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Android & Windows Preview Build and Publish Release
        if: steps.sync.outputs.updated == 'true' || github.event.inputs.force_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BEFORE_ID=$(gh run list --repo "$GH_REPO" --workflow=preview.yml --limit=1 --json databaseId -q '.[0].databaseId' || echo "")
          gh workflow run preview.yml \
            --repo "$GH_REPO" \
            --ref master \
            -f branch=feat/self-hosted-profile-sync \
            -f build_android=true \
            -f build_windows=true \
            -f build_ios=false \
            -f build_macos=false \
            -f build_linux=false

          RUN_ID=""
          for i in $(seq 1 24); do
            sleep 5
            CANDIDATE=$(gh run list --repo "$GH_REPO" --workflow=preview.yml --limit=1 --json databaseId -q '.[0].databaseId' || echo "")
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "null" ] && [ "$CANDIDATE" != "$BEFORE_ID" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for Build Preview run to appear."
            exit 1
          fi

          echo "Watching Build Preview run $RUN_ID..."
          gh run watch "$RUN_ID" --repo "$GH_REPO" --exit-status

          rm -rf ./artifacts
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir ./artifacts
          find ./artifacts -type f -maxdepth 3
          mkdir -p ./release-files
          find ./artifacts -type f -exec mv -t ./release-files {} +

          shopt -s nullglob
          files=(./release-files/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No artifacts downloaded from run $RUN_ID."
            exit 1
          fi

          gh release delete sync-preview --repo "$GH_REPO" --cleanup-tag --yes || true
          gh release create sync-preview "${files[@]}" \
            --repo "$GH_REPO" \
            --title "Profile Sync Preview (Latest)" \
            --notes "Automated build from https://github.com/$GH_REPO/actions/runs/$RUN_ID." \
            --prerelease
